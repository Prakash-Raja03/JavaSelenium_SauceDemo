# ============================================================
#  Framework configuration
#  Any value can be overridden at runtime, e.g.:
#     mvn test -Dbrowser=firefox -Dheadless=true
# ============================================================

# Application under test
baseUrl=https://www.saucedemo.com

# Browser: chrome | firefox | edge
browser=chrome

# Run without a visible browser window (recommended for CI)
headless=true

# Waits (seconds)
implicitWait=10
explicitWait=15

# Debug/observation only: when true, save a PNG screenshot after each browser
# action into the 'screenshots/' folder, so you can review the whole workflow
# step by step afterwards. Keep false for normal/CI runs.
# Enable at runtime, e.g.:  mvn test -DscreenshotSteps=true
screenshotSteps=false
